baseURL = "https://munich-nlp.com/"
languageCode = "en"
title = "Munich NLP"
theme = "hugo-initio"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# Make existing photos available to Hugo's build-time image processing.
[[module.mounts]]
    source = "assets"
    target = "assets"
[[module.mounts]]
    source = "static/images"
    target = "assets/photos"

[params]
    name = "Munich NLP"
    description = "Munich NLP brings together researchers, developers and AI enthusiasts for NLP, large language model and AI talks, workshops and meetups in Munich."
    seoTitle = "Munich NLP | NLP, LLM & AI Meetups in Munich"
    email = ""
    phone = ""
    address = ""
    year = 2022
    avatar = "images/munichnlp.png"
    avatarclass = ""
    background = ""
    banner = "images/UI/munich_foehn.png"
    bannerMobile = "images/UI/munich_frauenkirche.jpg"
    favicon = "images/favicon.png"
    DateForm = ""
    author = ""

    production = false
    redirectUrl = "https://www.munich-nlp.com/"

    showSubheader = true
    showEvents = true
    showOrganizers = false
    showPartners = false

    showFooterContact = false
    showFooterFollowMe = true
    showFooterTextWidget = false
    showFooterFormWidget = false

    # how many past events to show in the homepage
    pastEventsPreview = 5

[[menu.main]]
    name = "About"
    url = "/#about"
    weight = 1
[[menu.main]]
    name = "Events"
    url = "/events/"
    weight = 5
[[menu.main]]
    name = "Organizers"
    url = "/organizers/"
    weight = 17

[params.disqus]
    site = "hugo-initio-site.disqus.com"

[params.sharethis]
    property = "123456789012345678901234"
    custom = true

[params.google.analytics]
    trackerID = "GA-000000000-0"

[[params.social]]
    title = "luma"
    url = "https://luma.com/munichnlp"
    icon = "far fa-calendar-alt"
    footer = true
    sharethis = true
    network = "luma"
[[params.social]]
    title = "instagram"
    url = "https://www.instagram.com/munich.nlp/"
    icon = "fab fa-instagram"
    footer = true
    sharethis = true
    network = "instagram"
[[params.social]]
    title = "discord"
    url = "https://discord.gg/XWjVzYvjAu"
    icon = "fab fa-discord"
    footer = true
    sharethis = true
    network = "discord"
[[params.social]]
    title = "linkedin"
    url = "https://www.linkedin.com/company/munich-nlp/"
    icon = "fab fa-linkedin-in"
    footer = true
    sharethis = true
