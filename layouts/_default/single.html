{{ define "main" }}
<main id="main">

	<div class="container">

		<div class="row topspace">
			<div class="col-sm-8 col-sm-offset-2">

 				<article class="post">
					<header class="entry-header">
						<h1 class="entry-title"><a href="{{ .Permalink }}" rel="bookmark">{{ partial "brand/text.html" .Title }}</a></h1>
						 <div class="entry-meta">
							<span class="posted-on">
								<!-- <time class="entry-date published" datetime="{{ .Date.Format .Site.Params.DateForm }}">
									{{- .Date.Format "January 2, 2006" -}}
								</time> -->
							</span>
 						</div>
					</header>
					<div class="entry-content">
						{{ partial "brand/content.html" .Content }}
					</div>
				</article><!-- #post-## -->

			</div>
		</div> <!-- /row post  -->

		<div class="row">
			<div class="col-sm-8 col-sm-offset-2">

				<div id="share">
					{{ if .Params.Share }}
							{{ partial "sharethis.html" . }}
					{{ end }}
				</div>
			</div>
		</div> <!-- /row share -->
		<div class="clearfix"></div>

		<div class="row">
			<div class="col-sm-8 col-sm-offset-2">

				<div id="comments">
					{{ if .Params.Comments }}
							{{ partial "disqus.html" . }}
					{{ end }}
				</div>
			</div>
		</div> <!-- /row comments -->
		<div class="clearfix"></div>

	</div>	<!-- /container -->

</main>
{{ end }}
