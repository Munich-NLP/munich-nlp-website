<header id="header">
  <style>
    #head {
      background-image: url('{{ .Site.Params.banner | relURL }}');
    }
    @media (max-width: 768px) {
      #head {
        background-image: url('{{ .Site.Params.bannerMobile | default .Site.Params.banner | relURL }}');
      }
    }
  </style>
  <div id="head" class="parallax" data-parallax-speed="2">
    <h1 id="logo" class="text-center">
      <a href="/">
        <img class='img-{{ .Site.Params.avatarclass | default "noborder"}}' src="{{ .Site.BaseURL }}{{ .Site.Params.avatar }}" alt="">
      </a>
      <!-- <span class="title"><a href="/">{{ .Site.Params.name }}</a></span> -->
      <span class="tagline">{{ .Site.Params.description }}<br>
        <a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a>
      </span>
   </h1>
</div>

{{ partial "head/menu.html" . }}
</header>
