<header id="header">
  <style>
    #head {
      background-image: url('{{ .Site.Params.banner | relURL }}');
    }
    @media (max-width: 768px) {
      #head {
        background-image: url('{{ .Site.Params.bannerMobile | default .Site.Params.banner | relURL }}');
      }
    }
  </style>
  <div id="head" class="parallax" data-parallax-speed="2">
    <div id="logo" class="site-hero-content text-center">
      <a class="site-logo" href="/">
        <img class="img-{{ .Site.Params.avatarclass | default "noborder"}}" src="{{ .Site.BaseURL }}{{ .Site.Params.avatar }}" alt="Munich NLP">
      </a>
      {{ if .IsHome }}
        <p class="site-tagline">Munich’s community for NLP, LLMs &amp; AI</p>
        <p class="site-hero-pillars">Research · Industry · Community</p>
        <a class="site-hero-cta" href="/events/">Explore upcoming events</a>
        <a class="site-hero-credit" href="https://unsplash.com/photos/FZZ1rJc1FM4" target="_blank" rel="noopener noreferrer">Photo: Julian Ostarek · Unsplash</a>
      {{ end }}
    </div>
  </div>

  {{ partial "head/menu.html" . }}
</header>
