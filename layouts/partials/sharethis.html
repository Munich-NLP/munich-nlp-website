<div class="row">
    <div class="col-xs-12 col-sm-offset-1 col-sm-10 col-md-offset-2 col-md-8">
        {{ if .Site.Params.sharethis.custom }}
            {{ range .Site.Params.social }}
                {{ if .sharethis }}
                    <div data-network="{{ .network }}" data-title="{{ .Title }} >> " class="st-custom-button"> {{ partial "icon.html" (dict "name" .icon "class" "site-icon-large") }} </div>
                {{ end }}
            {{ end }}
            <div data-network="sharethis" data-title="{{ .Title }} >> " class="st-custom-button"> {{ partial "icon.html" (dict "name" "share-alt-square" "class" "site-icon-large") }} </div>
        {{ else }}
            <div class="sharethis-inline-share-buttons"></div>
            <br>
        {{ end }}
    </div>
</div> <!-- /row of widgets -->
